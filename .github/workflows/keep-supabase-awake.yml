# Free Supabase projects pause after ~7 days without database activity.
# Every 3 days this asks the database a question with the app's public key.
# The tables are locked to that key, so the database answers "permission denied" (42501):
# that answer still comes from Postgres, so it counts as activity and changes nothing.
# If the project is paused or down, the run fails and GitHub emails you.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database a question
        run: |
          body=$(curl -s -w '\n%{http_code}' \
            'https://udvgikxsawdslrddpbms.supabase.co/rest/v1/user_data?select=*&limit=1' \
            -H 'apikey: sb_publishable_HD7QOMCgLTa1pF55roNwFg_ZYRAIMqp')
          echo "$body"
          code=$(echo "$body" | tail -n1)
          if [ "$code" = "200" ] || echo "$body" | grep -q '42501'; then
            echo "Database answered, project is awake."
          else
            echo "Database did not answer (HTTP $code). Check the project at supabase.com/dashboard."
            exit 1
          fi
